<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https://tile.openstreetmap.org data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Choose location</title>
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
            background: #dbe4ea;
            font-family: sans-serif;
        }
        #map {
            position: relative;
        }
        .tile {
            position: absolute;
            width: 256px;
            height: 256px;
            image-rendering: auto;
            user-select: none;
            -webkit-user-drag: none;
        }
        #marker {
            display: none;
            position: absolute;
            width: 28px;
            height: 28px;
            margin-left: -14px;
            margin-top: -28px;
            z-index: 800;
            pointer-events: none;
        }
        #marker::before {
            content: "";
            position: absolute;
            left: 6px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            background: #1976d2;
            border: 3px solid white;
            box-shadow: 0 1px 4px rgba(0,0,0,.5);
        }
        #marker::after {
            content: "";
            position: absolute;
            left: 12px;
            top: 6px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: white;
        }
        #message {
            position: absolute;
            z-index: 1000;
            left: 12px;
            right: 12px;
            top: 12px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(38,50,56,.88);
            color: white;
            font-size: 14px;
            pointer-events: none;
            text-align: start;
        }
        #zoom {
            position: absolute;
            z-index: 1000;
            inset-inline-end: 12px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #zoom button {
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 8px;
            background: rgba(38,50,56,.92);
            color: white;
            font-size: 24px;
        }
        #attribution {
            position: absolute;
            z-index: 1000;
            inset-inline-end: 8px;
            bottom: 0;
            padding: 2px 5px;
            background: rgba(255,255,255,.82);
            color: #263238;
            font-size: 11px;
            direction: ltr;
            unicode-bidi: isolate;
        }
    </style>
</head>
<body>
<div id="map">
    <div id="message">Tap the map to place the marker. Drag to pan.</div>
    <div id="marker"></div>
    <div id="zoom">
        <button type="button" id="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
    </div>
    <div id="attribution">© OpenStreetMap contributors</div>
</div>
<script>
(function () {
    "use strict";

    const tileSize = 256;
    const minZoom = 2;
    const maxZoom = 19;
    const params = new URLSearchParams(location.search);
    const initialLat = Number(params.get("lat"));
    const initialLng = Number(params.get("lng"));
    let hasMarker = params.has("lat")
            && params.has("lng")
            && Number.isFinite(initialLat)
            && Number.isFinite(initialLng)
            && initialLat >= -90
            && initialLat <= 90
            && initialLng >= -180
            && initialLng <= 180;
    let markerLat = hasMarker ? clamp(initialLat, -85.05112878, 85.05112878) : Number.NaN;
    let markerLng = hasMarker ? initialLng : Number.NaN;
    let zoom = hasMarker ? 15 : minZoom;

    const map = document.getElementById("map");
    const marker = document.getElementById("marker");
    const tileNodes = new Map();

    let width = 0;
    let height = 0;
    let center = hasMarker
        ? latLngToWorld(markerLat, markerLng, zoom)
        : {x: scaleFor(zoom) / 2, y: scaleFor(zoom) / 2};
    const activePointers = new Map();
    const pinchZoomThreshold = 1.18;
    let dragPointerId = null;
    let dragStartX = 0;
    let dragStartY = 0;
    let dragCenterX = 0;
    let dragCenterY = 0;
    let moved = false;
    let pinching = false;
    let gestureHadPinch = false;
    let pinchStartDistance = 0;
    let pinchStartZoom = zoom;
    let pinchAnchor = {lat: 0, lng: 0};

    function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    }

    function scaleFor(z) {
        return tileSize * Math.pow(2, z);
    }

    function latLngToWorld(lat, lng, z) {
        lat = clamp(lat, -85.05112878, 85.05112878);
        const scale = scaleFor(z);
        const sinLat = Math.sin(lat * Math.PI / 180);
        return {
            x: (lng + 180) / 360 * scale,
            y: (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale
        };
    }

    function worldToLatLng(x, y, z) {
        const scale = scaleFor(z);
        const lng = x / scale * 360 - 180;
        const n = Math.PI - 2 * Math.PI * y / scale;
        const lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
        return {lat: lat, lng: lng};
    }

    function resize() {
        width = map.clientWidth || window.innerWidth;
        height = map.clientHeight || window.innerHeight;
        render();
    }

    function setMarker(lat, lng, shouldSend) {
        const numericLat = Number(lat);
        const numericLng = Number(lng);
        if (!Number.isFinite(numericLat) || !Number.isFinite(numericLng)) {
            return;
        }
        markerLat = clamp(numericLat, -85.05112878, 85.05112878);
        markerLng = numericLng;
        while (markerLng < -180) markerLng += 360;
        while (markerLng > 180) markerLng -= 360;
        hasMarker = true;
        marker.style.display = "block";
        updateMarkerPosition();
        if (shouldSend && window.AndroidBridge && AndroidBridge.onLocationSelected) {
            AndroidBridge.onLocationSelected(markerLat, markerLng);
        }
    }

    function updateMarkerPosition() {
        if (!hasMarker) {
            marker.style.display = "none";
            return;
        }
        const point = latLngToWorld(markerLat, markerLng, zoom);
        marker.style.left = Math.round(point.x - center.x + width / 2) + "px";
        marker.style.top = Math.round(point.y - center.y + height / 2) + "px";
    }

    function render() {
        if (!width || !height) {
            return;
        }
        center.x = clamp(center.x, 0, scaleFor(zoom));
        center.y = clamp(center.y, 0, scaleFor(zoom));
        const left = center.x - width / 2;
        const top = center.y - height / 2;
        const startX = Math.floor(left / tileSize);
        const endX = Math.floor((left + width) / tileSize);
        const startY = Math.floor(top / tileSize);
        const endY = Math.floor((top + height) / tileSize);
        const tileCount = Math.pow(2, zoom);
        const needed = new Set();

        for (let x = startX; x <= endX; x++) {
            for (let y = startY; y <= endY; y++) {
                if (y < 0 || y >= tileCount) {
                    continue;
                }
                const wrappedX = ((x % tileCount) + tileCount) % tileCount;
                const key = zoom + "/" + x + "/" + y;
                needed.add(key);
                let img = tileNodes.get(key);
                if (!img) {
                    img = document.createElement("img");
                    img.className = "tile";
                    img.alt = "";
                    img.decoding = "async";
                    img.src = "https://tile.openstreetmap.org/" + zoom + "/" + wrappedX + "/" + y + ".png";
                    map.insertBefore(img, marker);
                    tileNodes.set(key, img);
                }
                img.style.left = Math.round(x * tileSize - left) + "px";
                img.style.top = Math.round(y * tileSize - top) + "px";
            }
        }

        for (const [key, node] of tileNodes) {
            if (!needed.has(key)) {
                node.remove();
                tileNodes.delete(key);
            }
        }
        updateMarkerPosition();
    }

    function screenToLatLng(screenX, screenY) {
        return worldToLatLng(
            center.x + screenX - width / 2,
            center.y + screenY - height / 2,
            zoom
        );
    }

    function pointerPoint(event) {
        const rect = map.getBoundingClientRect();
        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };
    }

    function pointerDistance(first, second) {
        return Math.hypot(second.x - first.x, second.y - first.y);
    }

    function pointerMidpoint(first, second) {
        return {
            x: (first.x + second.x) / 2,
            y: (first.y + second.y) / 2
        };
    }

    function firstTwoPointerPoints() {
        const values = activePointers.values();
        const first = values.next();
        const second = values.next();
        if (first.done || second.done) {
            return null;
        }
        return [first.value, second.value];
    }

    function beginDrag(pointerId, point, suppressTap) {
        pinching = false;
        dragPointerId = pointerId;
        dragStartX = point.x;
        dragStartY = point.y;
        dragCenterX = center.x;
        dragCenterY = center.y;
        moved = Boolean(suppressTap);
    }

    function beginPinch() {
        const points = firstTwoPointerPoints();
        if (activePointers.size < 2 || !points) {
            return;
        }
        const midpoint = pointerMidpoint(points[0], points[1]);
        pinchStartDistance = Math.max(
            1,
            pointerDistance(points[0], points[1])
        );
        pinchStartZoom = zoom;
        pinchAnchor = screenToLatLng(midpoint.x, midpoint.y);
        pinching = true;
        gestureHadPinch = true;
        moved = true;
        dragPointerId = null;
    }

    function pinchZoomSteps(scale) {
        if (!Number.isFinite(scale) || scale <= 0) {
            return 0;
        }
        const logarithmic = Math.log(scale) / Math.log(pinchZoomThreshold);
        return logarithmic >= 0
            ? Math.floor(logarithmic + 1e-9)
            : Math.ceil(logarithmic - 1e-9);
    }

    function zoomAround(screenX, screenY, requestedZoom) {
        const targetZoom = clamp(Math.round(requestedZoom), minZoom, maxZoom);
        if (targetZoom === zoom) {
            return false;
        }

        const anchor = screenToLatLng(screenX, screenY);
        zoom = targetZoom;
        const anchorWorld = latLngToWorld(anchor.lat, anchor.lng, zoom);
        center = {
            x: anchorWorld.x - screenX + width / 2,
            y: anchorWorld.y - screenY + height / 2
        };
        tileNodes.forEach(node => node.remove());
        tileNodes.clear();
        render();
        return true;
    }

    function zoomBy(delta) {
        return zoomAround(width / 2, height / 2, zoom + delta);
    }

    function updatePinch() {
        const points = firstTwoPointerPoints();
        if (!points || pinchStartDistance <= 0) {
            return;
        }

        const currentMidpoint = pointerMidpoint(points[0], points[1]);
        const currentDistance = Math.max(
            1,
            pointerDistance(points[0], points[1])
        );
        const scale = currentDistance / pinchStartDistance;
        const targetZoom = clamp(
            pinchStartZoom + pinchZoomSteps(scale),
            minZoom,
            maxZoom
        );

        if (targetZoom !== zoom) {
            zoom = targetZoom;
            tileNodes.forEach(node => node.remove());
            tileNodes.clear();
        }

        const anchorWorld = latLngToWorld(
            pinchAnchor.lat,
            pinchAnchor.lng,
            zoom
        );
        center = {
            x: anchorWorld.x - currentMidpoint.x + width / 2,
            y: anchorWorld.y - currentMidpoint.y + height / 2
        };
        render();
    }

    map.addEventListener("pointerdown", function (event) {
        if (event.pointerType === "mouse" && event.button !== 0) {
            return;
        }
        event.preventDefault();

        if (activePointers.size === 0) {
            gestureHadPinch = false;
            moved = false;
        }

        const point = pointerPoint(event);
        activePointers.set(event.pointerId, point);
        try {
            map.setPointerCapture(event.pointerId);
        } catch (ignored) {
            // The pointer can still be tracked without explicit capture.
        }

        if (activePointers.size === 1) {
            beginDrag(event.pointerId, point, false);
        } else {
            beginPinch();
        }
    });

    map.addEventListener("pointermove", function (event) {
        if (!activePointers.has(event.pointerId)) {
            return;
        }
        event.preventDefault();

        const point = pointerPoint(event);
        activePointers.set(event.pointerId, point);

        if (activePointers.size >= 2) {
            if (!pinching) {
                beginPinch();
            }
            updatePinch();
            return;
        }

        if (pinching || dragPointerId !== event.pointerId) {
            return;
        }

        const dx = point.x - dragStartX;
        const dy = point.y - dragStartY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
            moved = true;
        }
        center.x = dragCenterX - dx;
        center.y = dragCenterY - dy;
        render();
    });

    function finishPointer(event, cancelled) {
        if (!activePointers.has(event.pointerId)) {
            return;
        }

        const point = pointerPoint(event);
        activePointers.set(event.pointerId, point);
        const wasPinching = pinching
                || activePointers.size > 1
                || gestureHadPinch;
        activePointers.delete(event.pointerId);

        try {
            if (map.hasPointerCapture(event.pointerId)) {
                map.releasePointerCapture(event.pointerId);
            }
        } catch (ignored) {
            // Pointer teardown remains safe if capture was already released.
        }

        if (activePointers.size >= 2) {
            beginPinch();
            return;
        }

        if (activePointers.size === 1) {
            const remaining = activePointers.entries().next().value;
            beginDrag(remaining[0], remaining[1], wasPinching);
            if (wasPinching) {
                gestureHadPinch = true;
            }
            return;
        }

        const shouldPlaceMarker = !cancelled
                && !gestureHadPinch
                && !wasPinching
                && dragPointerId === event.pointerId
                && !moved;

        pinching = false;
        dragPointerId = null;
        pinchStartDistance = 0;

        if (shouldPlaceMarker) {
            const value = screenToLatLng(point.x, point.y);
            setMarker(value.lat, value.lng, true);
        }

        gestureHadPinch = false;
        moved = false;
    }

    map.addEventListener("pointerup", function (event) {
        event.preventDefault();
        finishPointer(event, false);
    });

    map.addEventListener("pointercancel", function (event) {
        event.preventDefault();
        finishPointer(event, true);
    });

    map.addEventListener("lostpointercapture", function (event) {
        if (activePointers.has(event.pointerId)) {
            finishPointer(event, true);
        }
    });

    document.getElementById("zoomIn").addEventListener("click", function (event) {
        event.stopPropagation();
        zoomBy(1);
    });
    document.getElementById("zoomOut").addEventListener("click", function (event) {
        event.stopPropagation();
        zoomBy(-1);
    });

    window.addEventListener("resize", resize);
    document.getElementById("zoom").addEventListener("pointerdown", function (event) {
        event.stopPropagation();
    });

    window.GeoMap = {
        setLocation: function (newLat, newLng, newZoom) {
            if (Number.isFinite(Number(newZoom))) {
                zoom = clamp(Math.round(Number(newZoom)), minZoom, maxZoom);
            }
            setMarker(Number(newLat), Number(newLng), true);
            if (!hasMarker) {
                return;
            }
            center = latLngToWorld(markerLat, markerLng, zoom);
            tileNodes.forEach(node => node.remove());
            tileNodes.clear();
            render();
        }
    };

    resize();
})();
</script>
</body>
</html>
